name: typecheck

on:
  pull_request:
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --ignore-scripts：跳过 electron 二进制下载与原生模块构建，类型检查不需要
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm typecheck
